name: CI - Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpassword
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up database tables
        working-directory: ./gateway
        run: python database.py
        env:
          PGHOST: localhost

      - name: Start RAG Core
        working-directory: ./rag-core
        run: nohup uvicorn app:app --host 0.0.0.0 --port 8000 > rag-core.log 2>&1 &
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Start Gateway
        working-directory: ./gateway
        run: nohup uvicorn app:app --host 0.0.0.0 --port 8001 > gateway.log 2>&1 &

      - name: Wait for services to be ready
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/health && echo "RAG Core is up" && break
            echo "Waiting for RAG Core..."
            sleep 2
          done
          for i in {1..15}; do
            curl -sf http://localhost:8001/health && echo "Gateway is up" && break
            echo "Waiting for Gateway..."
            sleep 2
          done

      - name: Warm up the embedding model
        run: |
          echo "Sending a warm-up request to force the embedding model to fully load..."
          curl -s -X POST http://localhost:8000/retrieve \
            -H "Content-Type: application/json" \
            -d '{"question": "warm up", "top_k": 1}' \
            --max-time 60 \
            -w "\nHTTP Status: %{http_code}\n"
          echo "Warm-up complete."

      - name: Show RAG Core logs if warm-up had issues
        if: always()
        working-directory: ./rag-core
        run: cat rag-core.log || echo "No log file found"

      - name: Run full test suite
        run: pytest tests/ -v
        env:
          SIMULATE_FAILURE: "false"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}